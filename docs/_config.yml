title: "Election Pulse Documentation"
description: "Architecture, quality, governance, deployment, and development documentation for Election Pulse."

theme: jekyll-theme-primer

url: "https://basic-nature.github.io"
baseurl: "/html_Parser_prototype"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: true

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

exclude:
  - archived/
  - node_modules/
  - vendor/
  - "*.json"
  - "*.log"
  - "*.txt"