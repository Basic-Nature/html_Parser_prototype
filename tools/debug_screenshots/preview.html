<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screenshot Preview</title>
  <style>
    body{font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:#0f1419;color:#e2e8f0;padding:20px}
    h1{font-size:20px;margin-bottom:12px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
    .card{background:#11161a;padding:8px;border:1px solid #22303a;border-radius:6px}
    img{width:100%;height:auto;display:block;border-radius:4px}
    .meta{font-size:13px;color:#94a3b8;margin-top:6px}
    a{color:#6ba5b0}
  </style>
</head>
<body>
  <h1>Captured screenshots — open full-size by clicking an image</h1>
  <div class="grid">
    <div class="card"><a href="shot_360x900.png" target="_blank"><img src="shot_360x900.png" alt="360x900"></a><div class="meta">360 × 900 — mobile</div></div>
    <div class="card"><a href="shot_768x900.png" target="_blank"><img src="shot_768x900.png" alt="768x900"></a><div class="meta">768 × 900 — tablet</div></div>
    <div class="card"><a href="shot_1024x900.png" target="_blank"><img src="shot_1024x900.png" alt="1024x900"></a><div class="meta">1024 × 900 — small desktop</div></div>
    <div class="card"><a href="shot_1280x900.png" target="_blank"><img src="shot_1280x900.png" alt="1280x900"></a><div class="meta">1280 × 900 — desktop</div></div>
  </div>
  <p style="margin-top:14px;color:#94a3b8">Files are in <strong>tools/debug_screenshots/</strong>. Open this file in your browser for a quick glance.</p>
</body>
</html>
