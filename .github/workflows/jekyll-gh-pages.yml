# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: GitHub Pages Docs - Jekyll Build & Deploy

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      # Explicit guard: docs workflow should not run for Azure/webapp-only changes
      - '!webapp/**'
      - '!scripts/**'
      - '!automate.py'
      - '!.github/workflows/main_ballotlens.yml'
      - 'docs/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.github/workflows/jekyll-gh-pages.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  docs-quality:
    name: Docs Quality (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Markdown lint (docs only)
        run: |
          npm install -g markdownlint-cli
          markdownlint "docs/**/*.md" \
            --config .markdownlint.json \
            --disable MD013 MD024
      - name: Docs quality summary
        if: always()
        run: |
          {
            echo "## Docs Quality"
            echo "- Scope: docs/** markdown checks"
            echo "- Mode: non-blocking (visibility only)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Build job
  build:
    name: Build Docs (Jekyll)
    runs-on: ubuntu-latest
    needs: docs-quality
    env:
      NODE_OPTIONS: "--trace-deprecation"
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
      - name: Install Bundler and dependencies
        run: |
          gem install bundler
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3
      - name: Build site with Jekyll (bundle exec)
        run: bundle exec jekyll build --source ./docs --destination ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}

  # Deployment job
  deploy:
    name: Deploy Docs (GitHub Pages)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  docs-routing-smoke:
    name: Docs Routing Smoke (non-blocking)
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    steps:
      - name: Probe key docs routes
        run: |
          set -e
          BASE="https://basic-nature.github.io/html_Parser_prototype/"
          URLS=(
            "$BASE"
            "${BASE}DOCUMENTATION-INDEX"
            "${BASE}FEATURES/"
            "${BASE}DEVELOPMENT/"
          )
          for u in "${URLS[@]}"; do
            echo "Probing: $u"
            final=$(curl -L -s -o /dev/null -w "%{url_effective}" "$u")
            code=$(curl -L -s -o /dev/null -w "%{http_code}" "$u")
            echo "  final=$final status=$code"
            if [ "$code" -ge 400 ]; then
              echo "  warning: route returned HTTP $code"
            fi
          done
      - name: Docs routing summary
        if: always()
        run: |
          {
            echo "## Docs Routing Smoke"
            echo "- Site: https://basic-nature.github.io/html_Parser_prototype/"
            echo "- Mode: non-blocking (visibility only)"
            echo "- Purpose: detect link/route regressions without blocking docs deploy"
          } >> "$GITHUB_STEP_SUMMARY"
