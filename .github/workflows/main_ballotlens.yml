# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build and deploy Python app to Azure Web App - BallotLens

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils libpq-dev

      - name: List files (recursive)
        run: ls -R

      - name: Check requirements.txt exists
        run: |
          if [ ! -f "requirements.txt" ]; then
            echo "ERROR: requirements.txt not found at repo root!"
            exit 1
          fi

      - name: Check webapp folder exists
        run: |
          if [ ! -d "webapp" ]; then
            echo "ERROR: webapp folder not found at repo root!"
            exit 1
          fi

      - name: List contents to be zipped
        run: |
          ls -l
          ls -l webapp || true

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B566CEC09D3C4CF7BCF8B92816B2E49B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_45A19DCEBB104A13899B398979A13C7C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C02E93E542F546278A8CA28E381AB4F9 }}

      - name: Set Azure App Settings (Environment Variables)
        run: |
          az webapp config appsettings set \
            --name BallotLens \
            --resource-group BallotLens_group \
            --settings \
              FLASK_SECRET_KEY="${{ secrets.FLASK_SECRET_KEY }}" \
              FLASK_COOKIE_SECURE="True" \
              POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
              POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              POSTGRES_DB="${{ secrets.POSTGRES_DB }}" \
              POSTGRES_HOST="${{ secrets.POSTGRES_HOST }}" \
              POSTGRES_PORT="${{ secrets.POSTGRES_PORT }}" \
              POSTGRES_SERVICE_NAME="${{ secrets.POSTGRES_SERVICE_NAME }}"

      - name: Set Azure startup command
        run: |
          az webapp config set --name BallotLens --resource-group BallotLens_group --startup-file "python -m webapp.Smart_Elections_Parser_Webapp"

      - name: Create deployment zip
        run: |
          zip -r deploy.zip webapp requirements.txt

      - name: List contents of deploy.zip
        run: unzip -l deploy.zip

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'BallotLens'
          slot-name: 'Production'
          package: deploy.zip