# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Azure WebApp Deploy - BallotLens (Dynamic App)

on:
  push:
    branches:
      - main
    paths:
      # Explicit guard: ignore docs-only/static-site updates in Azure deploy workflow
      - '!docs/**'
      - '!.github/workflows/jekyll-gh-pages.yml'
      - 'webapp/**'
      - 'scripts/**'
      - '!scripts/maintenance/**'
      - 'tests/testdata/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - 'automate.py'
      - 'gunicorn.conf.py'
      - 'install.py'
      - 'install.sh'
      - '.github/workflows/main_ballotlens.yml'
  workflow_dispatch:
    inputs:
      post_deploy_db_confirm_strict:
        description: "Fail workflow when post-deploy live DB confirmation finds issues"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  IMAGE_NAME: ballotlens
  IMAGE_TAG: ${{ github.sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REPORT_RETENTION_DAYS: "30"
  REPORT_MAX_FILES: "200"
  REPORT_MAX_BYTES: "268435456"
  DL_COMPARE_STRICT: "false"
  DL_COMPARE_DL1_PATH: ""
  DL_COMPARE_DL2_PATH: ""
  POST_DEPLOY_DB_CONFIRM_STRICT: ${{ github.event_name == 'workflow_dispatch' && inputs.post_deploy_db_confirm_strict || 'true' }}
  POST_DEPLOY_DB_CONFIRM_TIMEOUT_SEC: "60"
  POST_DEPLOY_READY_MAX_ATTEMPTS: "12"
  POST_DEPLOY_READY_SLEEP_SEC: "20"
  POST_DEPLOY_API_MAX_ATTEMPTS: "6"
  POST_DEPLOY_API_SLEEP_SEC: "15"
  DYNAMIC_SITE_URL: "https://www.electionpulse.org/"
  DOCS_SITE_URL: "https://basic-nature.github.io/html_Parser_prototype/"
  # Contract tests import the Flask app at module load time; provide a safe CI fallback.
  FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY || 'ci-nonprod-flask-secret-key' }}
  # Contract tests import the Flask app at module load time; provide a safe CI fallback.
  GUARDED_INGESTION_KEY: ${{ secrets.GUARDED_INGESTION_KEY || 'ci-nonprod-guarded-ingestion-key' }}

jobs:
  qa-dl-compare:
    name: "Pre-Deploy QA: Synthetic DL fixture compare"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Ensure Git LFS assets are hydrated (QA job)
        run: |
          git lfs install
          git lfs pull

      - name: Guard against unresolved LFS pointer in constants.py
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("webapp/parser/Context_Integration/Context_Library/constants.py")
          if not target.exists():
              raise SystemExit("Missing constants.py in QA job checkout")

          head = target.read_text(encoding="utf-8", errors="replace")[:200]
          if "git-lfs.github.com/spec/v1" in head:
              raise SystemExit(
                  "Git LFS pointer detected for constants.py after checkout; refusing to run automate.py."
              )

          print("LFS guard passed for constants.py")
          PY

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --prefer-binary -r requirements.txt
          pip install --no-cache-dir --prefer-binary -r requirements-dev.txt

      - name: Run synthetic DL fixture compare (pre-deploy)
        run: |
          dl1="${{ env.DL_COMPARE_DL1_PATH }}"
          dl2="${{ env.DL_COMPARE_DL2_PATH }}"

          if [ -z "$dl1" ] || [ -z "$dl2" ]; then
            echo "DL fixture compare skipped: DL_COMPARE_DL1_PATH or DL_COMPARE_DL2_PATH is not set."
            echo "This stage is synthetic regression only, not live DB confirmation."
            exit 0
          fi

          if [ ! -f "$dl1" ] || [ ! -f "$dl2" ]; then
            echo "DL fixture compare skipped: fixture file(s) missing."
            echo "  dl1=$dl1 exists=$([ -f \"$dl1\" ] && echo yes || echo no)"
            echo "  dl2=$dl2 exists=$([ -f \"$dl2\" ] && echo yes || echo no)"
            exit 0
          fi

          set +e
          python automate.py \
            --intended-env ci \
            --skip-health \
            --skip-web \
            --skip-tests \
            --skip-webapp-check \
            --compare-dl1-dl2 \
            --dl1-path "$dl1" \
            --dl2-path "$dl2" \
            --enforce-report-retention \
            --report-retention-days "${{ env.REPORT_RETENTION_DAYS }}" \
            --report-max-files "${{ env.REPORT_MAX_FILES }}" \
            --report-max-bytes "${{ env.REPORT_MAX_BYTES }}"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "${{ env.DL_COMPARE_STRICT }}" = "true" ]; then
            echo "DL compare failed in strict mode; blocking deploy."
            exit "$rc"
          fi
          if [ "$rc" -ne 0 ]; then
            echo "DL compare failed in non-strict mode; continuing for visibility."
          else
            echo "DL compare passed."
          fi

      - name: Upload DL compare QA artifacts
        if: always() && (hashFiles('output/reports/data_comparison_latest.json') != '' || hashFiles('output/reports/automation_run_latest.json') != '' || hashFiles('output/reports/logs/**') != '')
        uses: actions/upload-artifact@v5
        with:
          name: dl-compare-qa-${{ github.run_id }}
          path: |
            output/reports/data_comparison_latest.json
            output/reports/automation_run_latest.json
            output/reports/logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: QA summary
        if: always()
        run: |
          {
            echo "## Pre-Deploy QA (Synthetic DL fixture compare)"
            echo "- Stage timing: **before** Azure deploy"
            echo "- Purpose: parser regression signal against provided fixture files"
            echo "- Not a live webapp/database confirmation check"
            echo "- Default mode: non-strict (signal + artifacts, deploy continues)"
            echo "- Strict toggle: set \`DL_COMPARE_STRICT=true\` to block deploy on mismatch"
            echo "- DL1 path: '${{ env.DL_COMPARE_DL1_PATH }}'"
            echo "- DL2 path: '${{ env.DL_COMPARE_DL2_PATH }}'"
            echo "- Artifact bundle: dl-compare-qa-${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

  contract-checks-nonblocking:
    name: "Pre-Deploy QA: Contract checks (non-blocking)"
    needs: qa-dl-compare
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # Keep critical app-import requirements local to this job so collection doesn't fail.
      FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY || 'ci-nonprod-flask-secret-key' }}
      GUARDED_INGESTION_KEY: ${{ secrets.GUARDED_INGESTION_KEY || 'ci-nonprod-guarded-ingestion-key' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --prefer-binary -r requirements.txt
          pip install --no-cache-dir --prefer-binary -r requirements-dev.txt
          python -m pip install --no-cache-dir pytest

      - name: Verify pytest availability
        run: |
          python -m pytest --version

      - name: Install Node dependencies
        run: npm install

      - name: Run backend contract tests (fast enforced subset)
        run: |
          python -m pytest -q -m "not live_integration" \
            webapp/tests/test_auth_and_observability_contracts.py \
            webapp/tests/test_route_handler_contracts.py \
            webapp/tests/test_error_handling_suite.py \
            webapp/tests/test_ballot_lens_pathways.py

      - name: Run frontend contract tests (auth + data framework + ballot lens)
        run: |
          npx jest --config=jest.config.js --runInBand \
            webapp/static/js/__tests__/auth_utils.contract.test.js \
            webapp/static/js/__tests__/data_framework.contract.test.js \
            webapp/static/js/__tests__/ballot_lens_modern.placeholder.test.js

      - name: Contract checks summary
        if: always()
        run: |
          {
            echo "## Pre-Deploy QA (Contract checks, non-blocking)"
            echo "- Backend contracts: cert/auth + route-handler + error-path + deterministic ballot-lens pathway checks"
            echo "- Frontend contracts: auth utils + data framework + ballot lens module checks"
            echo "- Live integration marker policy: \`live_integration\` tests are excluded by default"
            echo "- Mode: non-blocking (signals quality while implementation hardens)"
            echo "- Next phase: tighten to blocking once stability and pass-rate are sustained"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-deploy:
    name: Azure Deploy (dynamic webapp)
    needs:
      - qa-dl-compare
      - contract-checks-nonblocking
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B566CEC09D3C4CF7BCF8B92816B2E49B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_45A19DCEBB104A13899B398979A13C7C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C02E93E542F546278A8CA28E381AB4F9 }}

      - name: CI context summary (environment separation)
        run: |
          {
            echo "## CI Context"
            echo "- Workflow scope: **Azure dynamic deployment**"
            echo "- Dynamic webapp target: ${{ env.DYNAMIC_SITE_URL }}"
            echo "- Docs (separate GitHub Pages pipeline): ${{ env.DOCS_SITE_URL }}"
            echo "- Synthetic DL fixture compare QA: pre-deploy optional regression signal"
            echo "- DL compare strict mode: ${{ env.DL_COMPARE_STRICT }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show resolved image reference (debug)
        run: |
          echo "ACR_NAME=${{ secrets.ACR_NAME }}"
          echo "ACR_LOGIN_SERVER=${{ secrets.ACR_LOGIN_SERVER }}"
          echo "IMAGE_NAME=${{ env.IMAGE_NAME }}"
          echo "IMAGE_TAG=${{ env.IMAGE_TAG }}"
          echo "Resolved image: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      - name: Show disk usage before build
        run: df -h

      - name: Show memory usage before build
        run: free -h

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'

      - name: Install system dependencies (runner)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils ghostscript \
            libgl1 libglib2.0-0 libsm6 libxrender1 libxext6 libpq-dev build-essential gcc

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Git LFS Pull
        run: |
          git lfs install
          git lfs pull

      - name: List files (recursive)
        run: ls -R

      - name: Check requirements.txt exists
        run: |
          if [ ! -f "requirements.txt" ]; then
            echo "ERROR: requirements.txt not found at repo root!"
            exit 1
          fi

      - name: Guard against committed runtime env files
        run: |
          set -e
          tracked_env=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '(^|/)\.env\.template$' || true)
          if [ -n "$tracked_env" ]; then
            echo "ERROR: runtime .env files are committed. Remove them and keep secrets in GitHub/Azure settings."
            echo "$tracked_env"
            exit 1
          fi
          echo "No committed runtime .env files detected."

      - name: Check webapp folder exists
        run: |
          if [ ! -d "webapp" ]; then
            echo "ERROR: webapp folder not found at repo root!"
            exit 1
          fi

      - name: Debug requirements.txt (first 40 lines)
        run: |
          echo "---- requirements.txt ----"
          nl -ba requirements.txt | sed -n '1,40p'

      - name: Install Python dependencies (no cache, prefer binary)
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install --no-cache-dir --prefer-binary -r requirements.txt
          pip install --no-cache-dir --prefer-binary -r requirements-dev.txt
          python -m pytest --version

      - name: Install Playwright browsers (runner)
        run: python -m playwright install --with-deps chromium

      - name: Remove unnecessary files from site-packages
        run: |
          site_packages=$(python -c "import site; print(site.getsitepackages()[0])")
          find "$site_packages" -type d -name "tests" -exec rm -rf {} + || true
          find "$site_packages" -type d -name "__pycache__" -exec rm -rf {} + || true
          find "$site_packages" -type d -name "docs" -exec rm -rf {} + || true

      - name: Clean pip and build caches
        run: |
          rm -rf ~/.cache/pip build/ dist/ *.egg-info


      - name: Show disk usage after cleanup
        run: df -h

      - name: Show largest files and directories
        run: du -ah . | sort -rh | head -30

      - name: Show memory usage after cleanup
        run: free -h

      - name: Run tracked pytest suites
        run: |
          python -m pytest \
            webapp/tests \
            tests/test_html_scanner_fast_path_contract.py \
            -q

      - name: Run automation deployment smoke
        run: |
          python automate.py \
            --intended-env production \
            --skip-health \
            --skip-web \
            --skip-tests \
            --skip-webapp-check \
            --enforce-report-retention \
            --report-retention-days "${{ env.REPORT_RETENTION_DAYS }}" \
            --report-max-files "${{ env.REPORT_MAX_FILES }}" \
            --report-max-bytes "${{ env.REPORT_MAX_BYTES }}"

      - name: Enforce strict-path health score gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("output/reports/automation_run_latest.json")
          if not manifest_path.exists():
              raise SystemExit("Health gate failed: automation_run_latest.json not found")

          data = json.loads(manifest_path.read_text(encoding="utf-8"))
          strict_compare = bool(data.get("strict_compare_mode"))
          strict_preflight = bool(data.get("strict_embedding_preflight_mode"))
          strict_path = strict_compare or strict_preflight

          health = data.get("health_score") if isinstance(data.get("health_score"), dict) else {}
          state = str(health.get("state") or "").strip().lower()
          score = health.get("score")

          if strict_path and state == "red":
              raise SystemExit(f"Health gate failed on strict path: state=red score={score}")

          print(
              f"Health gate passed: strict_path={strict_path} state={state or 'unknown'} score={score}"
          )
          PY

      - name: Upload automation reports and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: automation-reports-${{ github.run_id }}
          path: |
            output/reports/**
            tools/debug_headless_output/**
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup local logs after ingestion and upload
        if: always()
        run: |
          rm -rf output/reports/logs
          find output/reports -type f -name "*.log" -delete || true
          rm -rf tools/debug_headless_output || true

      - name: Observability Guardrail (non-blocking failed-manifest smoke)
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          env = os.environ.copy()
          env["AUTOMATE_ALLOW_SIMULATED_FAILURE"] = "true"
          cmd = [
            sys.executable,
            "automate.py",
            "--skip-health",
            "--skip-web",
            "--skip-tests",
            "--skip-webapp-check",
            "--simulate-unhandled-failure",
          ]
          proc = subprocess.run(cmd, env=env, text=True, capture_output=True)
          print(proc.stdout)
          if proc.stderr:
            print(proc.stderr)

          manifest_path = pathlib.Path("output/reports/automation_run_latest.json")
          if not manifest_path.exists():
            raise SystemExit("Manifest smoke failed: automation_run_latest.json missing")

          data = json.loads(manifest_path.read_text(encoding="utf-8"))
          if data.get("status") != "failed":
            raise SystemExit(f"Manifest smoke failed: expected status=failed, got {data.get('status')!r}")
          unhandled = data.get("unhandled_exception")
          if not isinstance(unhandled, dict) or not unhandled.get("type"):
            raise SystemExit("Manifest smoke failed: missing unhandled_exception.type")
          if proc.returncode == 0:
            raise SystemExit("Manifest smoke failed: simulate run returned exit code 0")

          print("Manifest smoke passed: failed status + unhandled_exception captured.")
          PY

      - name: Show disk usage before container build
        run: df -h

      - name: Verify Dockerfile
        run: |
          if [ ! -f "Dockerfile" ]; then
            echo "ERROR: Dockerfile not found at repo root."
            exit 1
          fi

          head -n 10 Dockerfile || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ACR (docker)
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image (no ACR Tasks)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64
          cache-from: type=gha,scope=ballotlens
          cache-to: type=gha,mode=max,scope=ballotlens

      - name: Configure Web App to use custom container
        run: |
          az webapp config container set \
            --name BallotLens \
            --resource-group BallotLens_group \
            --docker-custom-image-name ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --docker-registry-server-url https://${{ secrets.ACR_LOGIN_SERVER }} \
            --docker-registry-server-user ${{ secrets.ACR_USERNAME }} \
            --docker-registry-server-password ${{ secrets.ACR_PASSWORD }}

      - name: Enforce HTTPS-only and redirect HTTP to HTTPS
        run: |
          # Ensure the Web App requires HTTPS only (prevents plain HTTP access)
          az webapp update --name BallotLens --resource-group BallotLens_group --set httpsOnly=true
          # Also set a best-effort app setting to hint redirect behavior (some platforms use this)
          az webapp config appsettings set --name BallotLens --resource-group BallotLens_group --settings WEBSITE_REDIRECT_HTTP_TO_HTTPS=1

      - name: Set Azure App Settings (Environment Variables)
        run: |
          az webapp config appsettings set \
            --name BallotLens \
            --resource-group BallotLens_group \
            --settings \
              DEPLOY_ENV="azure" \
              POSTGRES_AUTH="user" \
              POSTGRES_HOST="ballotlens-server.postgres.database.azure.com" \
              POSTGRES_DB="ballotlens-database" \
              POSTGRES_PORT="5432" \
              POSTGRES_AAD_USER="ballotlens" \
              POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
              POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              ENABLE_OCR="True" \
              ENABLE_OCR_FORCE="False" \
              LOG_LEVEL="DEBUG" \
              LOG_FORMAT="json" \
              WEBSITES_PORT="8000" \
              PLAYWRIGHT_BROWSERS_PATH="0" \
              FLASK_SECRET_KEY="${{ secrets.FLASK_SECRET_KEY }}" \
              FLASK_COOKIE_SECURE="True" \
              SOCKETIO_ALLOWED_ORIGINS="https://www.electionpulse.org,https://electionpulse.org" \
              SOCKETIO_USE_DB_QUEUE="true" \
              SOCKETIO_MESSAGE_CHANNEL="socketio" \
              GUNICORN_WORKER_CLASS="gthread" \
              GUNICORN_THREADS="4" \
              HEARTBEAT_ENABLED="true" \
              DATA_API_URL="/api/ballotlens-database" \
              CSP_MODE="STRICT" \
              GUARDED_INGESTION_KEY="${{ secrets.GUARDED_INGESTION_KEY }}" \
              REQUIRE_CERT_FOR_MUTATIONS="True" \
              HEALTH_TASK_TOKEN="${{ secrets.HEALTH_TASK_TOKEN }}" \
              ALLOW_DEV_NO_PRINCIPAL="false" \
              DEV_MODE="false" \
              DEBUG_MODE="false" \
              DEV_ISOLATION_BYPASS_ENABLED="false" \
              HEADLESS_DEFAULT="True" \
              ENABLE_FINGERPRINT_SESSION_RECOVERY="0" \
              ENABLE_SELENIUM_FALLBACK="True" \
              DISABLE_HTML_FALLBACK="1" \
              FORMAT_DETECTION_ENABLED="false" \
              ENABLE_PARALLEL="false" \
              LOG_REDIRECT_HEADERS="True" \
              LOG_REDIRECT_HEADERS_TTL_SEC="300" \
              DB_POOL_SIZE="10" \
              DB_MAX_OVERFLOW="20" \
              PAGE_LOAD_TIMEOUT="60" \
              MAX_URLS_DISPLAYED="10" \
              ENABLE_QUALITY_LOGGING="True" \
              SAVE_HTML_DUMPS="false" \
              SAVE_SCREENSHOTS_ON_ERROR="true" \
              SENTENCE_TRANSFORMER_LOCAL_PATH="/models/sentence/all-MiniLM-L6-v2" \
              TRANSFORMERS_OFFLINE="1" \
              HUGGINGFACE_HUB_OFFLINE="1" \
              HUGGINGFACE_HUB_CACHE="/models/hf-cache" \
              HF_HOME="/models/hf-cache" \
              GOOGLE_SHEETS_WORKLIST_ID="${{ secrets.GOOGLE_SHEETS_WORKLIST_ID }}" \
              GOOGLE_SHEETS_DB_LITE_ID="${{ secrets.GOOGLE_SHEETS_DB_LITE_ID }}" \
              GOOGLE_SHEETS_WORKLIST_OVERVIEW_SHEET="Overview" \
              GOOGLE_SHEETS_SA_TYPE="service_account" \
              GOOGLE_SHEETS_SA_PROJECT_ID="${{ secrets.GOOGLE_SHEETS_SA_PROJECT_ID }}" \
              GOOGLE_SHEETS_SA_PRIVATE_KEY_ID="${{ secrets.GOOGLE_SHEETS_SA_PRIVATE_KEY_ID }}" \
              GOOGLE_SHEETS_SA_PRIVATE_KEY="${{ secrets.GOOGLE_SHEETS_SA_PRIVATE_KEY }}" \
              GOOGLE_SHEETS_SA_CLIENT_EMAIL="${{ secrets.GOOGLE_SHEETS_SA_CLIENT_EMAIL }}" \
              GOOGLE_SHEETS_SA_CLIENT_ID="${{ secrets.GOOGLE_SHEETS_SA_CLIENT_ID }}" \
              GOOGLE_SHEETS_SA_AUTH_URI="https://accounts.google.com/o/oauth2/auth" \
              GOOGLE_SHEETS_SA_TOKEN_URI="https://oauth2.googleapis.com/token" \
              GOOGLE_SHEETS_SA_AUTH_PROVIDER_CERT_URL="https://www.googleapis.com/oauth2/v1/certs" \
              GOOGLE_SHEETS_SA_CLIENT_CERT_URL="${{ secrets.GOOGLE_SHEETS_SA_CLIENT_CERT_URL }}" \
              GOOGLE_SHEETS_SA_UNIVERSE_DOMAIN="googleapis.com" \
              SCM_DO_BUILD_DURING_DEPLOYMENT="false"

      - name: Restart Web App
        run: az webapp restart --name BallotLens --resource-group BallotLens_group

      - name: Post-deploy HTTPS redirect probe
        run: |
          set -e
          echo "Probing apex (http) -> final URL"
          FINAL1=$(curl -L -s -o /dev/null -w "%{url_effective}" http://electionpulse.org)
          echo "Final (http://electionpulse.org) -> $FINAL1"
          echo "Probing apex with www (http) -> final URL"
          FINAL2=$(curl -L -s -o /dev/null -w "%{url_effective}" http://www.electionpulse.org)
          echo "Final (http://www.electionpulse.org) -> $FINAL2"
          echo "Probing apex (https) -> final URL"
          FINAL3=$(curl -L -s -o /dev/null -w "%{url_effective}" https://electionpulse.org)
          echo "Final (https://electionpulse.org) -> $FINAL3"
          # Accept either with or without trailing slash
          OK1="https://www.electionpulse.org"
          OK2="https://www.electionpulse.org/"
          if [ "$FINAL1" != "$OK1" ] && [ "$FINAL1" != "$OK2" ]; then
            echo "ERROR: http://electionpulse.org did not end at https://www.electionpulse.org (got $FINAL1)"
            exit 1
          fi
          if [ "$FINAL2" != "$OK1" ] && [ "$FINAL2" != "$OK2" ]; then
            echo "ERROR: http://www.electionpulse.org did not end at https://www.electionpulse.org (got $FINAL2)"
            exit 1
          fi
          if [ "$FINAL3" != "$OK1" ] && [ "$FINAL3" != "$OK2" ]; then
            echo "ERROR: https://electionpulse.org did not end at https://www.electionpulse.org (got $FINAL3)"
            exit 1
          fi
          echo "Redirect probe OK: apex resolves to https://www.electionpulse.org"

  postdeploy-live-db-confirmation:
    name: "Post-Deploy Validation: Live app + data confirmation"
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Run live endpoint and data-shape assertions
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          from pathlib import Path
          from urllib import error, request

          base = os.environ.get("DYNAMIC_SITE_URL", "").strip().rstrip("/")
          strict = os.environ.get("POST_DEPLOY_DB_CONFIRM_STRICT", "true").strip().lower() == "true"
          timeout = int(os.environ.get("POST_DEPLOY_DB_CONFIRM_TIMEOUT_SEC", "45"))
          max_attempts = max(1, int(os.environ.get("POST_DEPLOY_READY_MAX_ATTEMPTS", "12")))
          sleep_sec = max(1, int(os.environ.get("POST_DEPLOY_READY_SLEEP_SEC", "20")))
          api_max_attempts = max(1, int(os.environ.get("POST_DEPLOY_API_MAX_ATTEMPTS", "6")))
          api_sleep_sec = max(1, int(os.environ.get("POST_DEPLOY_API_SLEEP_SEC", "15")))
          out_path = Path("output/reports/postdeploy_db_confirmation_latest.json")
          out_path.parent.mkdir(parents=True, exist_ok=True)

          if not base:
              raise SystemExit("DYNAMIC_SITE_URL is not configured")

          def fetch(path: str):
              url = f"{base}{path}"
              req = request.Request(
                  url,
                  headers={
                      "Accept": "application/json,text/plain,*/*",
                      "User-Agent": "ballotlens-postdeploy-check/1.0",
                  },
              )
              try:
                  with request.urlopen(req, timeout=timeout) as resp:
                      body = resp.read().decode("utf-8", errors="replace")
                      return {
                          "url": url,
                          "status": int(resp.getcode()),
                          "headers": dict(resp.headers.items()),
                          "body": body,
                          "error": None,
                      }
              except error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  return {
                      "url": url,
                      "status": int(exc.code),
                      "headers": dict(exc.headers.items()) if exc.headers else {},
                      "body": body,
                      "error": None,
                  }
              except Exception as exc:
                  return {
                      "url": url,
                      "status": None,
                      "headers": {},
                      "body": "",
                      "error": str(exc),
                  }

          def fetch_with_retry(path: str, *, validator, attempts: int, sleep_between: int, label: str):
              last = None
              for attempt in range(1, attempts + 1):
                  candidate = fetch(path)
                  candidate["attempt"] = attempt
                  last = candidate
                  try:
                      if validator(candidate):
                          return candidate
                  except Exception:
                      pass
                  if attempt < attempts:
                      print(f"{label} probe attempt {attempt}/{attempts} not ready; waiting {sleep_between}s...")
                      time.sleep(sleep_between)
              return last

          checks = []
          failures = []

          health = None
          for attempt in range(1, max_attempts + 1):
              candidate = fetch("/health")
              candidate["attempt"] = attempt
              health = candidate
              ok = False
              if not candidate["error"] and candidate["status"] == 200:
                  try:
                      payload = json.loads(candidate["body"] or "{}")
                      ok = str(payload.get("status", "")).lower() == "ok"
                  except Exception:
                      ok = False
              if ok:
                  break
              if attempt < max_attempts:
                  print(f"Health probe attempt {attempt}/{max_attempts} not ready; waiting {sleep_sec}s...")
                  time.sleep(sleep_sec)

          if health is None:
              health = {
                  "url": f"{base}/health",
                  "status": None,
                  "headers": {},
                  "body": "",
                  "error": "health probe did not execute",
                  "attempt": 0,
              }

          checks.append({"name": "health", **health})
          if health["error"] or health["status"] != 200:
              failures.append(f"/health must return HTTP 200 (last_error={health['error']!r}, status={health['status']})")
          else:
              try:
                  payload = json.loads(health["body"] or "{}")
                  if str(payload.get("status", "")).lower() != "ok":
                      failures.append("/health JSON must contain status=ok")
              except Exception:
                  failures.append("/health body must be valid JSON")

          if not failures:
              url_status = fetch_with_retry(
                  "/api/url_status?limit=5&hide_pii=true&include_production=false",
                  validator=lambda candidate: not candidate["error"] and candidate["status"] == 200,
                  attempts=api_max_attempts,
                  sleep_between=api_sleep_sec,
                  label="/api/url_status",
              )
              checks.append({"name": "api_url_status", **url_status})
              if url_status["error"] or url_status["status"] != 200:
                  failures.append(f"/api/url_status must return HTTP 200 (last_error={url_status['error']!r}, status={url_status['status']})")
              else:
                  try:
                      payload = json.loads(url_status["body"] or "{}")
                      required_keys = {"success", "total", "filtered", "entries", "status_breakdown", "canonical_statuses"}
                      missing = sorted(required_keys - set(payload.keys()))
                      if missing:
                          failures.append(f"/api/url_status missing keys: {', '.join(missing)}")
                      if payload.get("success") is not True:
                          failures.append("/api/url_status success must be true")
                      if not isinstance(payload.get("entries"), list):
                          failures.append("/api/url_status entries must be a list")
                      if not isinstance(payload.get("status_breakdown"), dict):
                          failures.append("/api/url_status status_breakdown must be an object")
                  except Exception:
                      failures.append("/api/url_status body must be valid JSON")

              warehouse_status = fetch_with_retry(
                  "/api/data_framework/warehouse_status",
                  validator=lambda candidate: not candidate["error"] and candidate["status"] in (200, 403),
                  attempts=api_max_attempts,
                  sleep_between=api_sleep_sec,
                  label="/api/data_framework/warehouse_status",
              )
              checks.append({"name": "api_data_framework_warehouse_status", **warehouse_status})
              if warehouse_status["error"]:
                  failures.append(f"/api/data_framework/warehouse_status request failed (last_error={warehouse_status['error']!r})")
              elif warehouse_status["status"] not in (200, 403):
                  failures.append("/api/data_framework/warehouse_status must return HTTP 200 or 403")
              elif warehouse_status["status"] == 200:
                  try:
                      payload = json.loads(warehouse_status["body"] or "{}")
                      if "available" not in payload:
                          failures.append("/api/data_framework/warehouse_status 200 response missing 'available'")
                  except Exception:
                      failures.append("/api/data_framework/warehouse_status 200 response must be valid JSON")
          else:
              checks.append({
                  "name": "api_checks_skipped",
                  "reason": "health_not_ready",
                  "details": "Skipped /api/url_status and /api/data_framework/warehouse_status because /health readiness did not pass",
              })

          report = {
              "status": "failed" if failures else "passed",
              "strict_mode": strict,
              "base_url": base,
              "checks": checks,
              "failures": failures,
          }
          out_path.write_text(json.dumps(report, indent=2), encoding="utf-8")

          print(f"Wrote report: {out_path}")
          if failures:
              print("Post-deploy validation failures:")
              for item in failures:
                  print(f"- {item}")
              if strict:
                  sys.exit(1)
              print("Strict mode disabled; continuing despite failures.")
          else:
              print("Post-deploy validation passed.")
          PY

      - name: Upload post-deploy validation artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: postdeploy-live-db-confirmation-${{ github.run_id }}
          path: |
            output/reports/postdeploy_db_confirmation_latest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Post-deploy validation summary
        if: always()
        run: |
          {
            echo "## Post-Deploy Live App + Data Confirmation"
            echo "- Target: ${{ env.DYNAMIC_SITE_URL }}"
            echo "- Readiness retry window: ${{ env.POST_DEPLOY_READY_MAX_ATTEMPTS }} attempts x ${{ env.POST_DEPLOY_READY_SLEEP_SEC }}s"
            echo "- Health endpoint: /health (must be 200 + status=ok)"
            echo "- Data shape endpoint: /api/url_status?limit=5&hide_pii=true (must be 200 + required keys)"
            echo "- Warehouse endpoint: /api/data_framework/warehouse_status (accept 200 or 403 in CI)"
            echo "- Strict mode: ${{ env.POST_DEPLOY_DB_CONFIRM_STRICT }}"
            echo "- Report artifact: postdeploy-live-db-confirmation-${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
