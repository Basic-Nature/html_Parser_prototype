# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions
name: Build and deploy Python app to Azure Web App - BallotLens

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            webapp
            requirements.txt

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils libpq-dev

      - name: Clear pip cache
        run: pip cache purge

      - name: Install Python dependencies (user)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: List files (recursive)
        run: ls -R

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B566CEC09D3C4CF7BCF8B92816B2E49B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_45A19DCEBB104A13899B398979A13C7C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C02E93E542F546278A8CA28E381AB4F9 }}
      - name: Debug rendered app-settings-json
        run: |
          echo '{
              "FLASK_SECRET_KEY": "dummy",
              "FLASK_COOKIE_SECURE": "True",
              "POSTGRES_USER": "dummy",
              "POSTGRES_PASSWORD": "dummy",
              "POSTGRES_DB": "dummy",
              "POSTGRES_HOST": "dummy",
              "POSTGRES_PORT": "dummy",
              "POSTGRES_SERVICE_NAME": "dummy"
            }'
      - name: Set Azure App Settings (Environment Variables)
        uses: azure/appservice-settings@v1
        with:
          app-name: 'BallotLens'
          app-settings-json: '{"FLASK_SECRET_KEY":"dummy","FLASK_COOKIE_SECURE":"True","POSTGRES_USER":"dummy","POSTGRES_PASSWORD":"dummy","POSTGRES_DB":"dummy","POSTGRES_HOST":"dummy","POSTGRES_PORT":"dummy","POSTGRES_SERVICE_NAME":"dummy"}'
              
      - name: Set Azure startup command
        run: |
          az webapp config set --name BallotLens --resource-group BallotLens_group --startup-file "python -m webapp.Smart_Elections_Parser_Webapp"

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'BallotLens'
          slot-name: 'Production'
          package: .