# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build and deploy Python app to Azure Web App - BallotLens

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Show disk usage before build
        run: df -h

      - name: Show memory usage before build
        run: free -h

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils libpq-dev

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Git LFS Pull
        run: |
          git lfs install
          git lfs pull

      - name: List files (recursive)
        run: ls -R

      - name: Check requirements.txt exists
        run: |
          if [ ! -f "requirements.txt" ]; then
            echo "ERROR: requirements.txt not found at repo root!"
            exit 1
          fi

      - name: Check webapp folder exists
        run: |
          if [ ! -d "webapp" ]; then
            echo "ERROR: webapp folder not found at repo root!"
            exit 1
          fi

      - name: List contents to be zipped
        run: |
          ls -l
          ls -l webapp || true

      - name: Install Python dependencies (no cache, prefer binary)
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install --no-cache-dir --prefer-binary -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Remove unnecessary files from site-packages
        run: |
          site_packages=$(python -c "import site; print(site.getsitepackages()[0])")
          find $site_packages -type d -name "tests" -exec rm -rf {} + || true
          find $site_packages -type d -name "__pycache__" -exec rm -rf {} + || true
          find $site_packages -type d -name "docs" -exec rm -rf {} + || true

      - name: Clean pip and build caches
        run: |
          rm -rf ~/.cache/pip
          rm -rf build/
          rm -rf dist/
          rm -rf *.egg-info

      - name: Copy Playwright browsers into webapp for deployment
        run: |
          mkdir -p webapp/ms-playwright
          cp -r ~/.cache/ms-playwright/* webapp/ms-playwright/ || true

      - name: Show disk usage after cleanup
        run: df -h

      - name: Show largest files and directories
        run: du -ah . | sort -rh | head -30

      - name: Show memory usage after cleanup
        run: free -h

      - name: Run tests (if present)
        run: |
          if [ -d "tests" ]; then
            echo "Running tests..."
            python -m unittest discover -s tests
          else
            echo "No tests directory found, skipping tests."
          fi

      - name: Show disk usage before deploy
        run: df -h

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B566CEC09D3C4CF7BCF8B92816B2E49B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_45A19DCEBB104A13899B398979A13C7C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C02E93E542F546278A8CA28E381AB4F9 }}

      - name: Set Azure App Settings (Environment Variables)
        run: |
          az webapp config appsettings set \
            --name BallotLens \
            --resource-group BallotLens_group \
            --settings \
              DEPLOY_ENV="azure" \
              FLASK_SECRET_KEY="${{ secrets.FLASK_SECRET_KEY }}" \
              FLASK_COOKIE_SECURE="True" \
              POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
              POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              POSTGRES_DB="${{ secrets.POSTGRES_DB }}" \
              POSTGRES_HOST="${{ secrets.POSTGRES_HOST }}" \
              POSTGRES_PORT="${{ secrets.POSTGRES_PORT }}" \
              POSTGRES_SERVICE_NAME="${{ secrets.POSTGRES_SERVICE_NAME }}" \
              DATA_API_URL="/api/warehouse_election_results" \
              CSP_MODE="STRICT" \
              HEADLESS_DEFAULT="True" \
              DISABLE_HTML_FALLBACK="1"

      - name: Set Playwright to use bundled browsers
        run: |
          az webapp config appsettings set \
            --name BallotLens \
            --resource-group BallotLens_group \
            --settings PLAYWRIGHT_BROWSERS_PATH=0          

      - name: Set Azure startup command
        run: |
          az webapp config set --name BallotLens --resource-group BallotLens_group --startup-file "python -m webapp.Smart_Elections_Parser_Webapp"

      - name: Enable Oryx build during deployment
        run: |
          az webapp config appsettings set \
            --name BallotLens \
            --resource-group BallotLens_group \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true

      - name: Create deployment package (webapp only)
        run: |
          zip -r webapp.zip webapp requirements.txt

      - name: List contents of deployment package
        run: unzip -l webapp.zip          

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'BallotLens'
          slot-name: 'Production'
          package: webapp.zip