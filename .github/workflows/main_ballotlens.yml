# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Azure WebApp Deploy - BallotLens (Dynamic App)

on:
  push:
    branches:
      - main
    paths:
      # Explicit guard: ignore docs-only/static-site updates in Azure deploy workflow
      - '!docs/**'
      - '!.github/workflows/jekyll-gh-pages.yml'
      - 'webapp/**'
      - 'scripts/**'
      - 'tests/testdata/**'
      - 'Dockerfile'
      - '.Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - 'automate.py'
      - 'gunicorn.conf.py'
      - 'install.py'
      - 'install.sh'
      - '.github/workflows/main_ballotlens.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ballotlens
  IMAGE_TAG: ${{ github.sha }}
  REPORT_RETENTION_DAYS: "30"
  REPORT_MAX_FILES: "200"
  REPORT_MAX_BYTES: "268435456"
  DYNAMIC_SITE_URL: "https://www.electionpulse.org/"
  DOCS_SITE_URL: "https://basic-nature.github.io/html_Parser_prototype/"

jobs:
  build-and-deploy:
    name: Azure Deploy (dynamic webapp)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B566CEC09D3C4CF7BCF8B92816B2E49B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_45A19DCEBB104A13899B398979A13C7C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C02E93E542F546278A8CA28E381AB4F9 }}

      - name: CI context summary (environment separation)
        run: |
          {
            echo "## CI Context"
            echo "- Workflow scope: **Azure dynamic deployment**"
            echo "- Dynamic webapp target: ${{ env.DYNAMIC_SITE_URL }}"
            echo "- Docs (separate GitHub Pages pipeline): ${{ env.DOCS_SITE_URL }}"
            echo "- DL compare QA: separate post-deploy non-blocking job in this workflow"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show resolved image reference (debug)
        run: |
          echo "ACR_NAME=${{ secrets.ACR_NAME }}"
          echo "ACR_LOGIN_SERVER=${{ secrets.ACR_LOGIN_SERVER }}"
          echo "IMAGE_NAME=${{ env.IMAGE_NAME }}"
          echo "IMAGE_TAG=${{ env.IMAGE_TAG }}"
          echo "Resolved image: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      - name: Show disk usage before build
        run: df -h

      - name: Show memory usage before build
        run: free -h

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Install system dependencies (runner)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils ghostscript \
            libgl1 libglib2.0-0 libsm6 libxrender1 libxext6 libpq-dev build-essential gcc

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Git LFS Pull
        run: |
          git lfs install
          git lfs pull

      - name: List files (recursive)
        run: ls -R

      - name: Check requirements.txt exists
        run: |
          if [ ! -f "requirements.txt" ]; then
            echo "ERROR: requirements.txt not found at repo root!"
            exit 1
          fi

      - name: Guard against committed runtime env files
        run: |
          set -e
          tracked_env=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '(^|/)\.env\.template$' || true)
          if [ -n "$tracked_env" ]; then
            echo "ERROR: runtime .env files are committed. Remove them and keep secrets in GitHub/Azure settings."
            echo "$tracked_env"
            exit 1
          fi
          echo "No committed runtime .env files detected."

      - name: Check webapp folder exists
        run: |
          if [ ! -d "webapp" ]; then
            echo "ERROR: webapp folder not found at repo root!"
            exit 1
          fi

      - name: Debug requirements.txt (first 40 lines)
        run: |
          echo "---- requirements.txt ----"
          nl -ba requirements.txt | sed -n '1,40p'

      - name: Install Python dependencies (no cache, prefer binary)
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install --no-cache-dir --prefer-binary -r requirements.txt

      - name: Install Playwright browsers (runner)
        run: python -m playwright install --with-deps

      - name: Remove unnecessary files from site-packages
        run: |
          site_packages=$(python -c "import site; print(site.getsitepackages()[0])")
          find "$site_packages" -type d -name "tests" -exec rm -rf {} + || true
          find "$site_packages" -type d -name "__pycache__" -exec rm -rf {} + || true
          find "$site_packages" -type d -name "docs" -exec rm -rf {} + || true

      - name: Clean pip and build caches
        run: |
          rm -rf ~/.cache/pip build/ dist/ *.egg-info

      - name: Copy Playwright browsers into webapp for deployment (if needed elsewhere)
        run: |
          mkdir -p webapp/ms-playwright
          cp -r ~/.cache/ms-playwright/* webapp/ms-playwright/ || true

      - name: Show disk usage after cleanup
        run: df -h

      - name: Show largest files and directories
        run: du -ah . | sort -rh | head -30

      - name: Show memory usage after cleanup
        run: free -h

      - name: Run tests (if present)
        run: |
          if [ -d "tests" ]; then
            echo "Running tests..."
            python -m unittest discover -s tests
          else
            echo "No tests directory found, skipping tests."
          fi

      - name: Run automation deployment smoke
        run: |
          python automate.py \
            --intended-env production \
            --skip-health \
            --skip-web \
            --skip-tests \
            --skip-webapp-check \
            --enforce-report-retention \
            --report-retention-days "${{ env.REPORT_RETENTION_DAYS }}" \
            --report-max-files "${{ env.REPORT_MAX_FILES }}" \
            --report-max-bytes "${{ env.REPORT_MAX_BYTES }}"

      - name: Enforce strict-path health score gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("output/reports/automation_run_latest.json")
          if not manifest_path.exists():
              raise SystemExit("Health gate failed: automation_run_latest.json not found")

          data = json.loads(manifest_path.read_text(encoding="utf-8"))
          strict_compare = bool(data.get("strict_compare_mode"))
          strict_preflight = bool(data.get("strict_embedding_preflight_mode"))
          strict_path = strict_compare or strict_preflight

          health = data.get("health_score") if isinstance(data.get("health_score"), dict) else {}
          state = str(health.get("state") or "").strip().lower()
          score = health.get("score")

          if strict_path and state == "red":
              raise SystemExit(f"Health gate failed on strict path: state=red score={score}")

          print(
              f"Health gate passed: strict_path={strict_path} state={state or 'unknown'} score={score}"
          )
          PY

      - name: Upload automation reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-reports-${{ github.run_id }}
          path: |
            output/reports/**
            tools/debug_headless_output/**
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup local logs after ingestion and upload
        if: always()
        run: |
          rm -rf output/reports/logs
          find output/reports -type f -name "*.log" -delete || true
          rm -rf tools/debug_headless_output || true

      - name: Observability Guardrail (non-blocking failed-manifest smoke)
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          env = os.environ.copy()
          env["AUTOMATE_ALLOW_SIMULATED_FAILURE"] = "true"
          cmd = [
            sys.executable,
            "automate.py",
            "--skip-health",
            "--skip-web",
            "--skip-tests",
            "--skip-webapp-check",
            "--simulate-unhandled-failure",
          ]
          proc = subprocess.run(cmd, env=env, text=True, capture_output=True)
          print(proc.stdout)
          if proc.stderr:
            print(proc.stderr)

          manifest_path = pathlib.Path("output/reports/automation_run_latest.json")
          if not manifest_path.exists():
            raise SystemExit("Manifest smoke failed: automation_run_latest.json missing")

          data = json.loads(manifest_path.read_text(encoding="utf-8"))
          if data.get("status") != "failed":
            raise SystemExit(f"Manifest smoke failed: expected status=failed, got {data.get('status')!r}")
          unhandled = data.get("unhandled_exception")
          if not isinstance(unhandled, dict) or not unhandled.get("type"):
            raise SystemExit("Manifest smoke failed: missing unhandled_exception.type")
          if proc.returncode == 0:
            raise SystemExit("Manifest smoke failed: simulate run returned exit code 0")

          print("Manifest smoke passed: failed status + unhandled_exception captured.")
          PY

      - name: Show disk usage before container build
        run: df -h

      - name: Verify Dockerfile
        run: |
          if [ ! -f "Dockerfile" ] && [ -f ".Dockerfile" ]; then
            echo "Found .Dockerfile, renaming to Dockerfile..."
            mv .Dockerfile Dockerfile
          fi
          if [ ! -f "Dockerfile" ]; then
            echo "ERROR: Dockerfile not found at repo root. Create Dockerfile (not .Dockerfile)."
            exit 1
          fi
          head -n 10 Dockerfile || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR (docker)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image (no ACR Tasks)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64

      - name: Configure Web App to use custom container
        run: |
          az webapp config container set \
            --name BallotLens \
            --resource-group BallotLens_group \
            --docker-custom-image-name ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --docker-registry-server-url https://${{ secrets.ACR_LOGIN_SERVER }} \
            --docker-registry-server-user ${{ secrets.ACR_USERNAME }} \
            --docker-registry-server-password ${{ secrets.ACR_PASSWORD }}

      - name: Enforce HTTPS-only and redirect HTTP to HTTPS
        run: |
          # Ensure the Web App requires HTTPS only (prevents plain HTTP access)
          az webapp update --name BallotLens --resource-group BallotLens_group --set httpsOnly=true
          # Also set a best-effort app setting to hint redirect behavior (some platforms use this)
          az webapp config appsettings set --name BallotLens --resource-group BallotLens_group --settings WEBSITE_REDIRECT_HTTP_TO_HTTPS=1

      - name: Set Azure App Settings (Environment Variables)
        run: |
          az webapp config appsettings set \
            --name BallotLens \
            --resource-group BallotLens_group \
            --settings \
              DEPLOY_ENV="azure" \
              POSTGRES_AUTH="user" \
              POSTGRES_HOST="ballotlens-server.postgres.database.azure.com" \
              POSTGRES_DB="ballotlens-database" \
              POSTGRES_PORT="5432" \
              POSTGRES_AAD_USER="ballotlens" \
              POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
              POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              ENABLE_OCR="True" \
              ENABLE_OCR_FORCE="False" \
              LOG_LEVEL="DEBUG" \
              LOG_FORMAT="json" \
              WEBSITES_PORT="8000" \
              PLAYWRIGHT_BROWSERS_PATH="0" \
              FLASK_SECRET_KEY="${{ secrets.FLASK_SECRET_KEY }}" \
              FLASK_COOKIE_SECURE="True" \
              SOCKETIO_ALLOWED_ORIGINS="https://www.electionpulse.org,https://electionpulse.org" \
              SOCKETIO_MESSAGE_QUEUE="${{ secrets.SOCKETIO_MESSAGE_QUEUE || '' }}" \
              SOCKETIO_MESSAGE_CHANNEL="socketio" \
              HEARTBEAT_ENABLED="true" \
              DATA_API_URL="/api/ballotlens-database" \
              CSP_MODE="STRICT" \
              GUARDED_INGESTION_KEY="${{ secrets.GUARDED_INGESTION_KEY }}" \
              REQUIRE_CERT_FOR_MUTATIONS="True" \
              HEALTH_TASK_TOKEN="${{ secrets.HEALTH_TASK_TOKEN }}" \
              ALLOW_DEV_NO_PRINCIPAL="false" \
              DEV_MODE="false" \
              DEBUG_MODE="false" \
              DEV_ISOLATION_BYPASS_ENABLED="false" \
              HEADLESS_DEFAULT="True" \
              ENABLE_FINGERPRINT_SESSION_RECOVERY="0" \
              ENABLE_SELENIUM_FALLBACK="True" \
              DISABLE_HTML_FALLBACK="1" \
              FORMAT_DETECTION_ENABLED="false" \
              ENABLE_PARALLEL="false" \
              LOG_REDIRECT_HEADERS="True" \
              LOG_REDIRECT_HEADERS_TTL_SEC="300" \
              DB_POOL_SIZE="10" \
              DB_MAX_OVERFLOW="20" \
              PAGE_LOAD_TIMEOUT="60" \
              MAX_URLS_DISPLAYED="10" \
              ENABLE_QUALITY_LOGGING="True" \
              SAVE_HTML_DUMPS="false" \
              SAVE_SCREENSHOTS_ON_ERROR="true" \
              SENTENCE_TRANSFORMER_LOCAL_PATH="/models/sentence/all-MiniLM-L6-v2" \
              TRANSFORMERS_OFFLINE="1" \
              HUGGINGFACE_HUB_OFFLINE="1" \
              HUGGINGFACE_HUB_CACHE="/models/hf-cache" \
              HF_HOME="/models/hf-cache" \
              GOOGLE_SHEETS_WORKLIST_ID="${{ secrets.GOOGLE_SHEETS_WORKLIST_ID }}" \
              GOOGLE_SHEETS_DB_LITE_ID="${{ secrets.GOOGLE_SHEETS_DB_LITE_ID }}" \
              GOOGLE_SHEETS_WORKLIST_OVERVIEW_SHEET="Overview" \
              GOOGLE_SHEETS_SA_TYPE="service_account" \
              GOOGLE_SHEETS_SA_PROJECT_ID="${{ secrets.GOOGLE_SHEETS_SA_PROJECT_ID }}" \
              GOOGLE_SHEETS_SA_PRIVATE_KEY_ID="${{ secrets.GOOGLE_SHEETS_SA_PRIVATE_KEY_ID }}" \
              GOOGLE_SHEETS_SA_PRIVATE_KEY="${{ secrets.GOOGLE_SHEETS_SA_PRIVATE_KEY }}" \
              GOOGLE_SHEETS_SA_CLIENT_EMAIL="${{ secrets.GOOGLE_SHEETS_SA_CLIENT_EMAIL }}" \
              GOOGLE_SHEETS_SA_CLIENT_ID="${{ secrets.GOOGLE_SHEETS_SA_CLIENT_ID }}" \
              GOOGLE_SHEETS_SA_AUTH_URI="https://accounts.google.com/o/oauth2/auth" \
              GOOGLE_SHEETS_SA_TOKEN_URI="https://oauth2.googleapis.com/token" \
              GOOGLE_SHEETS_SA_AUTH_PROVIDER_CERT_URL="https://www.googleapis.com/oauth2/v1/certs" \
              GOOGLE_SHEETS_SA_CLIENT_CERT_URL="${{ secrets.GOOGLE_SHEETS_SA_CLIENT_CERT_URL }}" \
              GOOGLE_SHEETS_SA_UNIVERSE_DOMAIN="googleapis.com" \
              SCM_DO_BUILD_DURING_DEPLOYMENT="false"

      - name: Restart Web App
        run: az webapp restart --name BallotLens --resource-group BallotLens_group

      - name: Post-deploy HTTPS redirect probe
        run: |
          set -e
          echo "Probing apex (http) -> final URL"
          FINAL1=$(curl -L -s -o /dev/null -w "%{url_effective}" http://electionpulse.org)
          echo "Final (http://electionpulse.org) -> $FINAL1"
          echo "Probing apex with www (http) -> final URL"
          FINAL2=$(curl -L -s -o /dev/null -w "%{url_effective}" http://www.electionpulse.org)
          echo "Final (http://www.electionpulse.org) -> $FINAL2"
          echo "Probing apex (https) -> final URL"
          FINAL3=$(curl -L -s -o /dev/null -w "%{url_effective}" https://electionpulse.org)
          echo "Final (https://electionpulse.org) -> $FINAL3"
          # Accept either with or without trailing slash
          OK1="https://www.electionpulse.org"
          OK2="https://www.electionpulse.org/"
          if [ "$FINAL1" != "$OK1" ] && [ "$FINAL1" != "$OK2" ]; then
            echo "ERROR: http://electionpulse.org did not end at https://www.electionpulse.org (got $FINAL1)"
            exit 1
          fi
          if [ "$FINAL2" != "$OK1" ] && [ "$FINAL2" != "$OK2" ]; then
            echo "ERROR: http://www.electionpulse.org did not end at https://www.electionpulse.org (got $FINAL2)"
            exit 1
          fi
          if [ "$FINAL3" != "$OK1" ] && [ "$FINAL3" != "$OK2" ]; then
            echo "ERROR: https://electionpulse.org did not end at https://www.electionpulse.org (got $FINAL3)"
            exit 1
          fi
          echo "Redirect probe OK: apex resolves to https://www.electionpulse.org"

  qa-dl-compare:
    name: "Post-Deploy QA: DL compare (non-blocking)"
    needs: build-and-deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: azure-postdeploy-qa
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure Git LFS assets are hydrated (QA job)
        run: |
          git lfs install
          git lfs pull

      - name: Guard against unresolved LFS pointer in constants.py
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("webapp/parser/Context_Integration/Context_Library/constants.py")
          if not target.exists():
              raise SystemExit("Missing constants.py in QA job checkout")

          head = target.read_text(encoding="utf-8", errors="replace")[:200]
          if "git-lfs.github.com/spec/v1" in head:
              raise SystemExit(
                  "Git LFS pointer detected for constants.py after checkout; refusing to run automate.py."
              )

          print("LFS guard passed for constants.py")
          PY

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --prefer-binary -r requirements.txt

      - name: Run DL compare QA (non-blocking)
        run: |
          python automate.py \
            --intended-env ci \
            --skip-health \
            --skip-web \
            --skip-tests \
            --skip-webapp-check \
            --compare-dl1-dl2 \
            --dl1-path tests/testdata/dl_compare_dl1_sample.json \
            --dl2-path tests/testdata/dl_compare_dl2_sample.json \
            --enforce-report-retention \
            --report-retention-days "${{ env.REPORT_RETENTION_DAYS }}" \
            --report-max-files "${{ env.REPORT_MAX_FILES }}" \
            --report-max-bytes "${{ env.REPORT_MAX_BYTES }}"

      - name: Upload DL compare QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dl-compare-qa-${{ github.run_id }}
          path: |
            output/reports/data_comparison_latest.json
            output/reports/automation_run_latest.json
            output/reports/logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: QA summary (non-blocking visibility)
        if: always()
        run: |
          {
            echo "## Post-Deploy QA (DL compare)"
            echo "- Mode: **non-blocking** (continue-on-error=true)"
            echo "- Purpose: QA signal and artifacts only; cannot block Azure deployment"
            echo "- Artifact bundle: dl-compare-qa-${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
