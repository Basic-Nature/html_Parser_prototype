# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build and deploy container with OCR - BallotLens

on:
  push:
    branches:
      - main
    paths:
      - 'webapp/**'
      - 'Dockerfile'
      - '.Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - 'gunicorn.conf.py'
      - 'install.py'
      - 'install.sh'
      - '.github/workflows/main_ballotlens.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ballotlens
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B566CEC09D3C4CF7BCF8B92816B2E49B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_45A19DCEBB104A13899B398979A13C7C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C02E93E542F546278A8CA28E381AB4F9 }}

      - name: Show resolved image reference (debug)
        run: |
          echo "ACR_NAME=${{ secrets.ACR_NAME }}"
          echo "ACR_LOGIN_SERVER=${{ secrets.ACR_LOGIN_SERVER }}"
          echo "IMAGE_NAME=${{ env.IMAGE_NAME }}"
          echo "IMAGE_TAG=${{ env.IMAGE_TAG }}"
          echo "Resolved image: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      - name: Show disk usage before build
        run: df -h

      - name: Show memory usage before build
        run: free -h

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Install system dependencies (runner)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils ghostscript \
            libgl1 libglib2.0-0 libsm6 libxrender1 libxext6 libpq-dev build-essential gcc

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Git LFS Pull
        run: |
          git lfs install
          git lfs pull

      - name: List files (recursive)
        run: ls -R

      - name: Check requirements.txt exists
        run: |
          if [ ! -f "requirements.txt" ]; then
            echo "ERROR: requirements.txt not found at repo root!"
            exit 1
          fi

      - name: Check webapp folder exists
        run: |
          if [ ! -d "webapp" ]; then
            echo "ERROR: webapp folder not found at repo root!"
            exit 1
          fi

      - name: Debug requirements.txt (first 40 lines)
        run: |
          echo "---- requirements.txt ----"
          nl -ba requirements.txt | sed -n '1,40p'

      - name: Install Python dependencies (no cache, prefer binary)
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install --no-cache-dir --prefer-binary -r requirements.txt

      - name: Install Playwright browsers (runner)
        run: python -m playwright install --with-deps

      - name: Remove unnecessary files from site-packages
        run: |
          site_packages=$(python -c "import site; print(site.getsitepackages()[0])")
          find "$site_packages" -type d -name "tests" -exec rm -rf {} + || true
          find "$site_packages" -type d -name "__pycache__" -exec rm -rf {} + || true
          find "$site_packages" -type d -name "docs" -exec rm -rf {} + || true

      - name: Clean pip and build caches
        run: |
          rm -rf ~/.cache/pip build/ dist/ *.egg-info

      - name: Copy Playwright browsers into webapp for deployment (if needed elsewhere)
        run: |
          mkdir -p webapp/ms-playwright
          cp -r ~/.cache/ms-playwright/* webapp/ms-playwright/ || true

      - name: Show disk usage after cleanup
        run: df -h

      - name: Show largest files and directories
        run: du -ah . | sort -rh | head -30

      - name: Show memory usage after cleanup
        run: free -h

      - name: Run tests (if present)
        run: |
          if [ -d "tests" ]; then
            echo "Running tests..."
            python -m unittest discover -s tests
          else
            echo "No tests directory found, skipping tests."
          fi

      - name: Show disk usage before container build
        run: df -h

      - name: Verify Dockerfile
        run: |
          if [ ! -f "Dockerfile" ] && [ -f ".Dockerfile" ]; then
            echo "Found .Dockerfile, renaming to Dockerfile..."
            mv .Dockerfile Dockerfile
          fi
          if [ ! -f "Dockerfile" ]; then
            echo "ERROR: Dockerfile not found at repo root. Create Dockerfile (not .Dockerfile)."
            exit 1
          fi
          head -n 10 Dockerfile || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR (docker)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image (no ACR Tasks)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64

      - name: Configure Web App to use custom container
        run: |
          az webapp config container set \
            --name BallotLens \
            --resource-group BallotLens_group \
            --docker-custom-image-name ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --docker-registry-server-url https://${{ secrets.ACR_LOGIN_SERVER }} \
            --docker-registry-server-user ${{ secrets.ACR_USERNAME }} \
            --docker-registry-server-password ${{ secrets.ACR_PASSWORD }}

      - name: Enforce HTTPS-only and redirect HTTP to HTTPS
        run: |
          # Ensure the Web App requires HTTPS only (prevents plain HTTP access)
          az webapp update --name BallotLens --resource-group BallotLens_group --set httpsOnly=true
          # Also set a best-effort app setting to hint redirect behavior (some platforms use this)
          az webapp config appsettings set --name BallotLens --resource-group BallotLens_group --settings WEBSITE_REDIRECT_HTTP_TO_HTTPS=1

      - name: Set Azure App Settings (Environment Variables)
        run: |
          az webapp config appsettings set \
            --name BallotLens \
            --resource-group BallotLens_group \
            --settings \
              DEPLOY_ENV="azure" \
              POSTGRES_AUTH="user" \
              POSTGRES_HOST="ballotlens-server.postgres.database.azure.com" \
              POSTGRES_DB="ballotlens-database" \
              POSTGRES_PORT="5432" \
              POSTGRES_AAD_USER="ballotlens" \
              POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
              POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              ENABLE_OCR="True" \
              ENABLE_OCR_FORCE="False" \
              LOG_LEVEL="DEBUG" \
              WEBSITES_PORT="8000" \
              PLAYWRIGHT_BROWSERS_PATH="0" \
              FLASK_SECRET_KEY="${{ secrets.FLASK_SECRET_KEY }}" \
              FLASK_COOKIE_SECURE="True" \
              SOCKETIO_ALLOWED_ORIGINS="https://www.electionpulse.org,https://electionpulse.org" \
              DATA_API_URL="/api/ballotlens-database" \
              CSP_MODE="STRICT" \
              GUARDED_INGESTION_KEY="${{ secrets.GUARDED_INGESTION_KEY }}" \
              REQUIRE_CERT_FOR_MUTATIONS="True" \
              HEADLESS_DEFAULT="True" \
              ENABLE_FINGERPRINT_SESSION_RECOVERY="0" \
              DISABLE_HTML_FALLBACK="1" \
              LOG_REDIRECT_HEADERS="True" \
              LOG_REDIRECT_HEADERS_TTL_SEC="300" \
              SENTENCE_TRANSFORMER_LOCAL_PATH="/models/sentence/all-MiniLM-L6-v2" \
              TRANSFORMERS_OFFLINE="1" \
              HUGGINGFACE_HUB_OFFLINE="1" \
              HUGGINGFACE_HUB_CACHE="/models/hf-cache" \
              HF_HOME="/models/hf-cache" \
              SCM_DO_BUILD_DURING_DEPLOYMENT="false"

      - name: Restart Web App
        run: az webapp restart --name BallotLens --resource-group BallotLens_group

      - name: Post-deploy HTTPS redirect probe
        run: |
          set -e
          echo "Probing apex (http) -> final URL"
          FINAL1=$(curl -L -s -o /dev/null -w "%{url_effective}" http://electionpulse.org)
          echo "Final (http://electionpulse.org) -> $FINAL1"
          echo "Probing apex with www (http) -> final URL"
          FINAL2=$(curl -L -s -o /dev/null -w "%{url_effective}" http://www.electionpulse.org)
          echo "Final (http://www.electionpulse.org) -> $FINAL2"
          echo "Probing apex (https) -> final URL"
          FINAL3=$(curl -L -s -o /dev/null -w "%{url_effective}" https://electionpulse.org)
          echo "Final (https://electionpulse.org) -> $FINAL3"
          # Accept either with or without trailing slash
          OK1="https://www.electionpulse.org"
          OK2="https://www.electionpulse.org/"
          if [ "$FINAL1" != "$OK1" ] && [ "$FINAL1" != "$OK2" ]; then
            echo "ERROR: http://electionpulse.org did not end at https://www.electionpulse.org (got $FINAL1)"
            exit 1
          fi
          if [ "$FINAL2" != "$OK1" ] && [ "$FINAL2" != "$OK2" ]; then
            echo "ERROR: http://www.electionpulse.org did not end at https://www.electionpulse.org (got $FINAL2)"
            exit 1
          fi
          if [ "$FINAL3" != "$OK1" ] && [ "$FINAL3" != "$OK2" ]; then
            echo "ERROR: https://electionpulse.org did not end at https://www.electionpulse.org (got $FINAL3)"
            exit 1
          fi
          echo "Redirect probe OK: apex resolves to https://www.electionpulse.org"
