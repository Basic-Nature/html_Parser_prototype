# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build and deploy Python app to Azure Web App - BallotLens

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Git LFS for large files
      - name: Git LFS Pull
        run: |
          set -e
          git lfs install
          git lfs pull

      - name: Show disk usage before build
        run: |
          set -e
          df -h

      - name: Show memory usage before build
        run: |
          set -e
          free -h

      # Use .python-version if present (optional)
      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils libpq-dev

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: List files (recursive)
        run: |
          set -e
          ls -R

      - name: Check requirements.txt exists
        run: |
          set -e
          if [ ! -f "requirements.txt" ]; then
            echo "ERROR: requirements.txt not found at repo root!"
            exit 1
          fi

      - name: Check webapp folder exists
        run: |
          set -e
          if [ ! -d "webapp" ]; then
            echo "ERROR: webapp folder not found at repo root!"
            exit 1
          fi

      - name: List contents to be zipped
        run: |
          set -e
          ls -l
          ls -l webapp || true

      # --- FIX: Install numpy first to avoid missing test modules ---
      - name: Install numpy (force reinstall, no cache)
        run: |
          set -e
          pip install --force-reinstall --no-cache-dir numpy

      - name: Install Python dependencies (no cache, prefer binary)
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install --no-cache-dir --prefer-binary -r requirements.txt
          # Ensure gunicorn and eventlet are present
          pip show gunicorn eventlet flask-socketio

      # Pin spaCy model version for reproducibility
      - name: Install spaCy en-core-web-sm==3.8.0 model
        run: |
          set -e
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl

      # Remove downloaded wheels after pip install
      - name: Remove downloaded wheels after pip install
        run: |
          set -e
          rm -rf /usr/local/share/pip-cache/wheels || true

      # --- FIX: Remove unnecessary files only after all pip installs ---
      - name: Remove unnecessary files from site-packages
        run: |
          set -e
          site_packages=$(python -c "import site; print(site.getsitepackages()[0])")
          find $site_packages -type d -name "tests" -exec rm -rf {} + || true
          find $site_packages -type d -name "__pycache__" -exec rm -rf {} + || true
          find $site_packages -type d -name "docs" -exec rm -rf {} + || true

      - name: Clean pip and build caches
        run: |
          set -e
          rm -rf ~/.cache/pip
          rm -rf build/
          rm -rf dist/
          rm -rf *.egg-info

      - name: Show disk usage after cleanup
        run: |
          set -e
          df -h

      - name: Show largest files and directories
        run: |
          set -e
          du -ah . | sort -rh | head -30

      - name: Show memory usage after cleanup
        run: |
          set -e
          free -h

      # Optional: Validate gunicorn startup (CI only, not in Azure)
      - name: Test gunicorn startup (CI only)
        run: |
          set -e
          gunicorn --worker-class eventlet -w 1 -b 127.0.0.1:9000 webapp.Smart_Elections_Parser_Webapp:app &
          sleep 10
          kill %1

      - name: Run tests (if present)
        run: |
          set -e
          if [ -d "tests" ]; then
            echo "Running tests..."
            python -m unittest discover -s tests
          else
            echo "No tests directory found, skipping tests."
          fi

      - name: Show disk usage before deploy
        run: |
          set -e
          df -h

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B566CEC09D3C4CF7BCF8B92816B2E49B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_45A19DCEBB104A13899B398979A13C7C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C02E93E542F546278A8CA28E381AB4F9 }}

      # Set environment variables and diagnostics settings
      - name: Set Azure App Settings (Environment Variables)
        run: |
          set -e
          az webapp config appsettings set \
            --name BallotLens \
            --resource-group BallotLens_group \
            --settings \
              FLASK_SECRET_KEY="${{ secrets.FLASK_SECRET_KEY }}" \
              FLASK_COOKIE_SECURE="True" \
              POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
              POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              POSTGRES_DB="${{ secrets.POSTGRES_DB }}" \
              POSTGRES_HOST="${{ secrets.POSTGRES_HOST }}" \
              POSTGRES_PORT="${{ secrets.POSTGRES_PORT }}" \
              POSTGRES_SERVICE_NAME="${{ secrets.POSTGRES_SERVICE_NAME }}" \
              FLASK_ENV="production" \
              FLASK_DEBUG="0" \
              PYTHONUNBUFFERED="1" \
              WEBSITES_ENABLE_APP_SERVICE_STORAGE="true" \
              WEBSITES_CONTAINER_START_TIME_LIMIT="1800" \
              WEBSITE_HEALTHCHECK_PATH="/health"

      # Set the production startup command using $PORT
      - name: Set Azure startup command (production, gunicorn + eventlet)
        run: |
          set -e
          az webapp config set --name BallotLens --resource-group BallotLens_group --startup-file "gunicorn --worker-class eventlet -w 1 -b 0.0.0.0:\$PORT webapp.Smart_Elections_Parser_Webapp:app"

      - name: Enable Oryx build during deployment
        run: |
          set -e
          az webapp config appsettings set \
            --name BallotLens \
            --resource-group BallotLens_group \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true

      - name: Create Python virtualenv
        run: |
          set -e
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install --no-cache-dir --prefer-binary -r requirements.txt
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl

      # Remove downloaded wheels after pip install in virtualenv (extra thorough)
      - name: Remove downloaded wheels after pip install in virtualenv
        run: |
          set -e
          rm -rf /usr/local/share/pip-cache/wheels || true

      - name: Remove unnecessary files from virtualenv
        run: |
          set -e
          find antenv -type d -name "tests" -exec rm -rf {} + || true
          find antenv -type d -name "__pycache__" -exec rm -rf {} + || true
          find antenv -type d -name "docs" -exec rm -rf {} + || true

      - name: Archive virtualenv and app
        run: |
          set -e
          tar czf app_package.tar.gz antenv webapp

      - name: 'Deploy pre-built artifact to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'BallotLens'
          slot-name: 'Production'
          package: app_package.tar.gz