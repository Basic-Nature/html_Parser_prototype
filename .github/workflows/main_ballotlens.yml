# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build and deploy container with OCR - BallotLens

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ballotlens
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B566CEC09D3C4CF7BCF8B92816B2E49B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_45A19DCEBB104A13899B398979A13C7C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C02E93E542F546278A8CA28E381AB4F9 }}

      - name: Show resolved image reference (debug)
        run: |
          echo "ACR_NAME=${{ secrets.ACR_NAME }}"
          echo "ACR_LOGIN_SERVER=${{ secrets.ACR_LOGIN_SERVER }}"
          echo "IMAGE_NAME=${{ env.IMAGE_NAME }}"
          echo "IMAGE_TAG=${{ env.IMAGE_TAG }}"
          echo "Resolved image: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      - name: Show disk usage before build
        run: df -h

      - name: Show memory usage before build
        run: free -h

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (runner)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils libpq-dev

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Git LFS Pull
        run: |
          git lfs install
          git lfs pull

      - name: List files (recursive)
        run: ls -R

      - name: Check requirements.txt exists
        run: |
          if [ ! -f "requirements.txt" ]; then
            echo "ERROR: requirements.txt not found at repo root!"
            exit 1
          fi

      - name: Check webapp folder exists
        run: |
          if [ ! -d "webapp" ]; then
            echo "ERROR: webapp folder not found at repo root!"
            exit 1
          fi

      - name: Install Python dependencies (no cache, prefer binary)
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install --no-cache-dir --prefer-binary -r requirements.txt

      - name: Install Playwright browsers (runner)
        run: python -m playwright install --with-deps

      - name: Remove unnecessary files from site-packages
        run: |
          site_packages=$(python -c "import site; print(site.getsitepackages()[0])")
          find "$site_packages" -type d -name "tests" -exec rm -rf {} + || true
          find "$site_packages" -type d -name "__pycache__" -exec rm -rf {} + || true
          find "$site_packages" -type d -name "docs" -exec rm -rf {} + || true

      - name: Clean pip and build caches
        run: |
          rm -rf ~/.cache/pip build/ dist/ *.egg-info

      - name: Copy Playwright browsers into webapp for deployment (if needed elsewhere)
        run: |
          mkdir -p webapp/ms-playwright
          cp -r ~/.cache/ms-playwright/* webapp/ms-playwright/ || true

      - name: Show disk usage after cleanup
        run: df -h

      - name: Show largest files and directories
        run: du -ah . | sort -rh | head -30

      - name: Show memory usage after cleanup
        run: free -h

      - name: Run tests (if present)
        run: |
          if [ -d "tests" ]; then
            echo "Running tests..."
            python -m unittest discover -s tests
          else
            echo "No tests directory found, skipping tests."
          fi

      - name: Show disk usage before container build
        run: df -h

      - name: Verify Dockerfile
        run: |
          if [ ! -f "Dockerfile" ] && [ -f ".Dockerfile" ]; then
            echo "Found .Dockerfile, renaming to Dockerfile..."
            mv .Dockerfile Dockerfile
          fi
          if [ ! -f "Dockerfile" ]; then
            echo "ERROR: Dockerfile not found at repo root. Create Dockerfile (not .Dockerfile)."
            exit 1
          fi
          head -n 10 Dockerfile || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR (docker)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image (no ACR Tasks)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64

      - name: Configure Web App to use custom container
        run: |
          az webapp config container set \
            --name BallotLens \
            --resource-group BallotLens_group \
            --docker-custom-image-name ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --docker-registry-server-url https://${{ secrets.ACR_LOGIN_SERVER }} \
            --docker-registry-server-user ${{ secrets.ACR_USERNAME }} \
            --docker-registry-server-password ${{ secrets.ACR_PASSWORD }}

      - name: Set Azure App Settings (Environment Variables)
        run: |
          az webapp config appsettings set \
            --name BallotLens \
            --resource-group BallotLens_group \
            --settings \
              DEPLOY_ENV="azure" \
              POSTGRES_AUTH="aad" \
              POSTGRES_HOST="ballotlens-server.postgres.database.azure.com" \
              POSTGRES_DB="ballotlens-database" \
              POSTGRES_PORT="5432" \
              POSTGRES_AAD_USER="BallotLens" \
              ENABLE_OCR="True" \
              ENABLE_OCR_FORCE="False" \
              LOG_LEVEL="DEBUG" \
              WEBSITES_PORT="8000" \
              PLAYWRIGHT_BROWSERS_PATH="0" \
              FLASK_SECRET_KEY="${{ secrets.FLASK_SECRET_KEY }}" \
              FLASK_COOKIE_SECURE="True" \
              DATA_API_URL="/api/warehouse_election_results" \
              CSP_MODE="STRICT" \
              HEADLESS_DEFAULT="True" \
              DISABLE_HTML_FALLBACK="1" \
              SCM_DO_BUILD_DURING_DEPLOYMENT="false"

      - name: Restart Web App
        run: az webapp restart --name BallotLens --resource-group BallotLens_group