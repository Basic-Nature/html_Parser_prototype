name: W23 Owned ACR Mirror Import

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: w23-owned-acr-mirror-import
  cancel-in-progress: false

jobs:
  mirror:
    name: Import exact published image into ElectionPulse-owned ACR
    runs-on: ubuntu-latest
    environment: Production
    env:
      SOURCE_ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      SOURCE_ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      SOURCE_ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      DESTINATION_ACR_NAME: electionpulseprodacr
      IMAGE_REPOSITORY: ballotlens
      IMAGE_TAG: 9e7c25a7f299a1e413c0e3749229cbda181d4529

    steps:
      - name: Checkout exact published source
        uses: actions/checkout@v5
        with:
          ref: 9e7c25a7f299a1e413c0e3749229cbda181d4529

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B566CEC09D3C4CF7BCF8B92816B2E49B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_45A19DCEBB104A13899B398979A13C7C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C02E93E542F546278A8CA28E381AB4F9 }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to source ACR only
        uses: docker/login-action@v4
        with:
          registry: ${{ env.SOURCE_ACR_LOGIN_SERVER }}
          username: ${{ env.SOURCE_ACR_USERNAME }}
          password: ${{ env.SOURCE_ACR_PASSWORD }}

      - name: Resolve exact source manifest digest
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_IMAGE="${{ SOURCE_ACR_LOGIN_SERVER }}/${{ IMAGE_REPOSITORY }}:${{ IMAGE_TAG }}"
          SOURCE_MANIFEST_JSON="$(docker buildx imagetools inspect "$SOURCE_IMAGE" --format '{{json .Manifest}}')"
          SOURCE_DIGEST="$(printf '%s' "$SOURCE_MANIFEST_JSON" | jq -r '.digest')"
          if [[ ! "$SOURCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid source manifest digest"
            exit 1
          fi
          echo "SOURCE_DIGEST=$SOURCE_DIGEST" >> "$GITHUB_ENV"
          echo "source_digest=$SOURCE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Verify destination ACR control plane
        shell: bash
        run: |
          set -euo pipefail
          ROLE_MODE="$(az acr show             --name "${{ DESTINATION_ACR_NAME }}"             --resource-group "BallotLens_group"             --query roleAssignmentMode -o tsv             --only-show-errors)"
          if [[ "$ROLE_MODE" != "AbacRepositoryPermissions" ]]; then
            echo "::error::Unexpected destination roleAssignmentMode: $ROLE_MODE"
            exit 1
          fi

      - name: Import exact source digest into owned mirror
        shell: bash
        run: |
          set -euo pipefail
          set +x
          SOURCE_BY_DIGEST="${{ SOURCE_ACR_LOGIN_SERVER }}/${{ IMAGE_REPOSITORY }}@${{ SOURCE_DIGEST }}"
          az acr import             --name "${{ DESTINATION_ACR_NAME }}"             --resource-group "BallotLens_group"             --source "$SOURCE_BY_DIGEST"             --image "${{ IMAGE_REPOSITORY }}:${{ IMAGE_TAG }}"             --username "${{ SOURCE_ACR_USERNAME }}"             --password "${{ SOURCE_ACR_PASSWORD }}"             --only-show-errors

      - name: Emit non-secret source digest evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          jq -n             --arg revision "W23ZAD_ELECTIONPULSE_OWNED_MIRROR_ACR_ONE_SHOT_IMPORT_WORKFLOW_REV1"             --arg source_commit "9e7c25a7f299a1e413c0e3749229cbda181d4529"             --arg repository "${{ IMAGE_REPOSITORY }}"             --arg tag "${{ IMAGE_TAG }}"             --arg source_digest "${{ SOURCE_DIGEST }}"             '{revision:$revision,source_commit:$source_commit,repository:$repository,tag:$tag,source_digest:$source_digest}'             > evidence/w23-owned-acr-source-digest.json

      - name: Upload digest evidence
        uses: actions/upload-artifact@v4
        with:
          name: w23-owned-acr-source-digest
          path: evidence/w23-owned-acr-source-digest.json
          if-no-files-found: error
          retention-days: 14
