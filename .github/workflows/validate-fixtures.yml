name: Validate Election Fixtures

on:
  push:
    paths:
      - 'webapp/parser/fixtures/*.json'
      - 'webapp/parser/fixtures/*.jsonl'
      - 'webapp/parser/fixtures/election_results_shards/**'
      - 'webapp/parser/Context_Integration/Context_Library/cache/*.json'
      - 'webapp/parser/Context_Integration/Context_Library/log/*.jsonl'
      - 'scripts/build_election_index.py'
      - 'webapp/parser/election_fixtures.py'
      - '.github/workflows/validate-fixtures.yml'
    branches:
      - main
      - develop
  pull_request:
    paths:
      - 'webapp/parser/fixtures/*.json'
      - 'webapp/parser/fixtures/*.jsonl'
      - 'webapp/parser/fixtures/election_results_shards/**'
      - 'webapp/parser/Context_Integration/Context_Library/cache/*.json'
      - 'webapp/parser/Context_Integration/Context_Library/log/*.jsonl'
      - 'scripts/build_election_index.py'
      - 'webapp/parser/election_fixtures.py'

jobs:
  validate-fixtures:
    runs-on: ubuntu-latest
    name: Build & Validate Election Fixtures
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git LFS Pull (if fixtures are LFS)
        run: |
          git lfs install
          git lfs pull
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema rapidfuzz
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check for fixture sources
        id: fixture_check
        run: |
          shopt -s nullglob
          csv_files=(webapp/parser/fixtures/*.csv)
          json_files=(webapp/parser/fixtures/election_results_index.json)
          jsonl_files=(webapp/parser/fixtures/election_results_index.jsonl webapp/parser/fixtures/election_results_index.jsonl.gz)
          shard_files=(webapp/parser/fixtures/election_results_shards/election_results_*.json)
          # Cache and log directories are gitignored; only check if they exist locally
          cache_files=()
          if [ -d "webapp/parser/Context_Integration/Context_Library/cache" ]; then
            cache_files=(webapp/parser/Context_Integration/Context_Library/cache/election*.json webapp/parser/Context_Integration/Context_Library/cache/context*.json)
          fi
          log_files=()
          if [ -d "webapp/parser/Context_Integration/Context_Library/log" ]; then
            log_files=(webapp/parser/Context_Integration/Context_Library/log/*_log.jsonl webapp/parser/Context_Integration/Context_Library/log/integrity*.jsonl webapp/parser/Context_Integration/Context_Library/log/trust*.jsonl)
          fi
          total_sources=$(( ${#csv_files[@]} + ${#json_files[@]} + ${#jsonl_files[@]} + ${#shard_files[@]} + ${#cache_files[@]} + ${#log_files[@]} ))
          if [ $total_sources -eq 0 ]; then
            echo "has_sources=false" >> "$GITHUB_OUTPUT"
            echo "No fixture sources found; skipping index build."
          else
            echo "has_sources=true" >> "$GITHUB_OUTPUT"
            echo "Found $total_sources fixture source files (CSV: ${#csv_files[@]}, JSON: ${#json_files[@]}, JSONL: ${#jsonl_files[@]}, Shards: ${#shard_files[@]}, Cache: ${#cache_files[@]}, Logs: ${#log_files[@]})."
          fi
      
      - name: Build election index
        if: steps.fixture_check.outputs.has_sources == 'true'
        run: |
          python scripts/build_election_index.py \
            --src webapp/parser/fixtures \
            --out webapp/parser/fixtures/election_results_index.json \
            --schema webapp/parser/fixtures/election_results_schema.json \
            --audit-report webapp/parser/fixtures/fixture_audit_report.jsonl \
            --max-file-size-mb 10 \
            --shard-threshold-mb 8
      
      - name: Validate schema
        if: steps.fixture_check.outputs.has_sources == 'true'
        run: |
          python -c "
          import json
          with open('webapp/parser/fixtures/election_results_index.json') as f:
              index = json.load(f)
          print(f'✓ Index valid JSON: {len(index)} entries')
          "
      
      - name: Check audit report
        if: steps.fixture_check.outputs.has_sources == 'true'
        run: |
          if [ -f "webapp/parser/fixtures/fixture_audit_report.jsonl" ]; then
            lines=$(wc -l < "webapp/parser/fixtures/fixture_audit_report.jsonl")
            echo "📋 Audit events: $lines"
            # Show errors and warnings
            grep -E '"type":\s*"(error|validation_error)"' "webapp/parser/fixtures/fixture_audit_report.jsonl" || echo "✓ No validation errors"
          fi
      
      - name: Test fixture loader
        if: steps.fixture_check.outputs.has_sources == 'true'
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'webapp')
          from parser import election_fixtures
          idx = election_fixtures.load_election_results_index()
          print(f'✓ Fixture loader OK: {len(idx)} entries cached')
          metrics = election_fixtures.get_cache_metrics()
          print(f'  Cache metrics: {metrics}')
          "
      
      - name: Commit updated index (if on main)
        if: steps.fixture_check.outputs.has_sources == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # Check if index changed
          if git diff --quiet webapp/parser/fixtures/election_results_index.json; then
            echo "✓ Index unchanged; no commit needed"
          else
            git add webapp/parser/fixtures/election_results_index.json
            git add webapp/parser/fixtures/election_results_shards/ || true
            git add webapp/parser/fixtures/fixture_audit_report.jsonl || true
            git commit -m "chore: regenerate election fixture index" || true
            git push
          fi
      
      - name: Create release tag (if on main)
        if: steps.fixture_check.outputs.has_sources == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          TAG="fixture-$(date +%Y%m%d-%H%M%S)"
          git tag "$TAG" || echo "Tag already exists"
          git push origin "$TAG" || echo "Could not push tag"

      - name: Report skip
        if: steps.fixture_check.outputs.has_sources != 'true'
        run: |
          echo "ℹ️  No fixture sources found; skipping fixture validation."
      
      - name: Report status
        if: failure()
        run: |
          echo "❌ Fixture validation failed"
          exit 1
      
      - name: Report success
        if: success()
        run: |
          echo "✅ Fixture validation passed"
          echo "  - Index built successfully"
          echo "  - Schema validated"
          echo "  - Loader tested"
