<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Data Framework | Smart Elections Parser</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/data_framework.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('index') }}">Dashboard</a>
        <a href="{{ url_for('data_framework') }}" class="active">Data Framework</a>
        <a href="{{ url_for('run_parser') }}">Run Parser</a>
        <a href="{{ url_for('history') }}">History</a>       
        <a href="https://basic-nature.github.io/html_Parser_prototype/" target="_blank">About</a>
    </nav>
    <div class="container-main">
        <h1>Data Framework</h1>
        <div class="subtitle">Upload, View, and Manage Election Data in PostgreSQL</div>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div class="upload-section">
            <form id="uploadForm" enctype="multipart/form-data" method="POST" action="/api/upload_csv">
                <label for="csvFile"><b>Upload CSV to Database:</b></label><br>
                <input type="file" id="csvFile" name="csv_file" accept=".csv" required>
                <button type="submit">Upload</button>
            </form>
            <div id="uploadStatus" class="status status-info" aria-live="polite"></div>
        </div>

        <div class="db-table-section">
            <div class="table-toolbar" role="region" aria-label="Table controls">
                <div class="left-controls">
                    <input id="globalSearch" type="search" placeholder="Search all columns..." aria-label="Search all data">
                </div>
                <div class="right-controls">
                    <button id="refreshBtn" class="btn action">🔄 Refresh</button>
                    <button id="exportCsvBtn" class="btn action">⬇ Export CSV</button>
                    <button id="resetFiltersBtn" class="btn action">↺ Reset</button>
                    <div class="column-chooser">
                        <button id="columnChooserBtn" class="btn action" aria-haspopup="true" aria-expanded="false">▦ Columns</button>
                        <div id="columnChooserMenu" class="column-chooser-menu" role="menu" aria-label="Toggle visible columns"></div>
                    </div>
                    <label for="pageSizeSelect" class="sr-only">Rows per page</label>
                    <select id="pageSizeSelect" aria-label="Rows per page">
                        <option value="10">10 rows</option>
                        <option value="25" selected>25 rows</option>
                        <option value="50">50 rows</option>
                        <option value="100">100 rows</option>
                    </select>
                </div>
            </div>

            <table id="data-table" class="neon-grid" aria-live="polite">
                <thead>
                    <tr id="table-header">
                        <!-- Dynamic headers -->
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Dynamic rows -->
                </tbody>
            </table>

            <div class="table-footer">
                <div class="pagination" role="navigation" aria-label="Pagination">
                    <button id="firstPageBtn" class="btn pager" aria-label="First page">⏮</button>
                    <button id="prevPageBtn" class="btn pager" aria-label="Previous page">◀</button>
                    <span id="pageInfo" class="page-info"></span>
                    <button id="nextPageBtn" class="btn pager" aria-label="Next page">▶</button>
                    <button id="lastPageBtn" class="btn pager" aria-label="Last page">⏭</button>
                </div>
                <div id="tableStatus" class="status status-info" aria-live="polite"></div>
            </div>
        </div>
    </div>
    <script>
      // Expose env-configured API URL to external JS
      window.__DATA_FRAMEWORK__ = {
        apiUrl: {{ data_api_url|tojson }}
      };
    </script>
    <script src="{{ url_for('static', filename='js/data_framework.js') }}" defer></script>
</body>
</html>
