<!DOCTYPE html>
<html lang="en" data-page="ballot-lens-f2">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ballot Lens — F2 Public Runtime Lifecycle</title>
  <meta name="description" content="ElectionPulse Ballot Lens F2 parser workspace">
  <meta name="color-scheme" content="dark light">
  {% for stylesheet in ballot_lens_f2_assets.styles %}
  <link rel="stylesheet" href="{{ url_for('static', filename=stylesheet) }}">
  {% endfor %}
</head>
<body data-page="ballot-lens-f2">
  <div
    id="ballotLensF2Root"
    data-mode="{{ 'trusted' if ballot_lens_trusted_controls else 'public' }}"
    data-trusted-controls="{{ '1' if ballot_lens_trusted_controls else '0' }}"
    data-public-registry-api="/api/public/ballot-lens/registry"
    data-data-api-url="{{ data_api_url|e }}"
    data-socketio-config='{{ socketio_client_config | tojson | forceescape }}'
    data-f2-phase="F2-E4"
  >
    <noscript>Ballot Lens F2 requires JavaScript.</noscript>
  </div>

  <script
    type="module"
    src="{{ url_for('static', filename=ballot_lens_f2_assets.script) }}"
  ></script>
</body>
</html>
